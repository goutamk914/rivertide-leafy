# Example workflow: deploy the Rivertide website to GitHub Pages.
# Copy to .github/workflows/deploy-website.yml at the repository root, then set
# Settings > Pages > Source to "GitHub Actions".
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'packages/leafy/**'
      - 'packages/island/**'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project sites live at /<repository-name>. Use '' for a custom domain.
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --workspace website --include-workspace-root

      - name: Check
        run: |
          npm run typecheck -w website
          npm run test -w website
          npm run test -w @rivertide/island

      - name: Build
        run: npm run build -w website

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
